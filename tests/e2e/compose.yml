services:
  browser:
    # Match package-lock.json. A shared Linux renderer makes goldens portable.
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    init: true
    shm_size: 1gb
    working_dir: /test
    volumes:
      - ../../node_modules:/test/node_modules:ro
    command: [node, node_modules/playwright/cli.js, run-server, --host, 0.0.0.0, --port, '3000']
    ports:
      - '127.0.0.1::3000'
    healthcheck:
      test: [CMD, node, -e, "const s=require('node:net').connect(3000,'127.0.0.1',()=>s.end());s.on('error',()=>process.exit(1));"]
      interval: 1s
      timeout: 3s
      retries: 60

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:?test runner required}
      POSTGRES_DB: blocklist_e2e
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U e2e -d blocklist_e2e"]
      interval: 1s
      timeout: 3s
      retries: 60

  redis:
    image: redis:8.10.1-alpine
    command: [redis-server, --save, '', --appendonly, 'no']
    tmpfs:
      - /data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 3s
      retries: 60

  app:
    image: ${E2E_IMAGE:?test runner required}
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      POSTGRES_URL: postgres://e2e:${E2E_DB_PASSWORD}@postgres:5432/blocklist_e2e?sslmode=disable
      POSTGRES_READ_URL: postgres://e2e:${E2E_DB_PASSWORD}@postgres:5432/blocklist_e2e?sslmode=disable
      REDIS_HOST: redis
      SECRET_KEY: ${E2E_SESSION_SECRET:?test runner required}
      GUIAdmin: ui-recovery
      GUIPassword: ${E2E_PASSWORD:?test runner required}
      GUIToken: ${E2E_TOTP_SECRET:?test runner required}
      RUN_WORKER_IN_PROCESS: 'false'
      ENABLE_OUTBOUND_WEBHOOKS: 'false'
      ENTRA_ENABLED: 'false'
      COOKIE_SECURE: 'false'
      RATE_LIMIT: '100000'
      RATE_LIMIT_LOGIN: '10000'
      RATE_LIMIT_WEBHOOK: '100000'
      PORT: '5000'
    ports:
      - '127.0.0.1::5000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:5000/health]
      interval: 1s
      timeout: 3s
      retries: 120
