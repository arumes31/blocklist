<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Reference - Blocklist</title>
    <link rel="icon" type="image/x-icon" href="/cd/favicon-color.png" />
    <script type="module" src="/js/rapidoc-min.js"></script>
    <script src="/static/js/docs-accessibility.js?v=1" defer></script>
    <link rel="stylesheet" href="/static/css/app.css?v=rail-continuity-1">
    <link rel="stylesheet" href="/static/css/docs-fields.css?v=docs-scroll-1">
</head>
<body class="app-page" data-page="docs">
    {{ template "app_navigation.html" . }}
    <header class="header-container">
        <div class="page-heading"><h1>API Reference</h1><p class="page-description">Explore endpoints, authentication, and request examples.</p></div>
    </header>
    <main id="main-content" class="docs-content">
    <rapi-doc
        spec-url="/openapi.json"
        theme="dark"
        bg-color="#111316"
        nav-bg-color="#191c20"
        nav-text-color="#a5adb8"
        nav-hover-bg-color="#2c3138"
        nav-hover-text-color="#eef0f3"
        regular-font="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        mono-font="Consolas, monospace"
        text-color="#eef0f3"
        primary-color="#e36b70"
        show-header="false"
        render-style="read"
        load-fonts="false"
        css-file="docs-fields.css?v=docs-scroll-1"
    > </rapi-doc>
    </main>
</body>
</html>
