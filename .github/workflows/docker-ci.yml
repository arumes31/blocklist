name: Docker Build and Check

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

# Shared with package cleanup; do not interrupt registry writes.
concurrency:
  group: container-publication
  cancel-in-progress: false

jobs:
  quality:
    name: Required quality gates
    uses: ./.github/workflows/go-ci.yml

  security:
    name: Required security gates
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml

  candidate:
    name: Build and scan candidate
    needs: [quality, security]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
      publish: ${{ steps.image.outputs.publish }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Validate production protection before building
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: node .github/scripts/image-policy.cjs
    - name: Select candidate (never a production alias)
      id: image
      shell: bash
      run: |
        echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
        publish=false
        case "$GITHUB_REF" in
          refs/heads/main) publish=true ;;
        esac
        echo "publish=$publish" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      if: steps.image.outputs.publish == 'true'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build candidate
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: Dockerfile
        push: ${{ steps.image.outputs.publish == 'true' }}
        load: ${{ steps.image.outputs.publish != 'true' }}
        platforms: linux/amd64
        provenance: ${{ steps.image.outputs.publish == 'true' && 'mode=max' || 'false' }}
        sbom: ${{ steps.image.outputs.publish == 'true' }}
        tags: ${{ steps.image.outputs.name }}:candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        labels: org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Scan exact candidate
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ steps.image.outputs.publish == 'true' && format('{0}@{1}', steps.image.outputs.name, steps.build.outputs.digest) || format('{0}:candidate-{1}-{2}-{3}', steps.image.outputs.name, github.sha, github.run_id, github.run_attempt) }}
        format: table
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: os,library
        severity: CRITICAL,HIGH
        trivyignores: scripts/ci/trivyignore
      env:
        TRIVY_USERNAME: ${{ github.actor }}
        TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  staging:
    name: Exercise exact candidate image
    needs: candidate
    if: needs.candidate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: '24'
        cache: npm
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - run: npm ci --ignore-scripts
    - name: Test migrations, login, API and desktop/mobile UI against digest
      env:
        E2E_IMAGE: ${{ needs.candidate.outputs.image }}@${{ needs.candidate.outputs.digest }}
      run: npm run test:ui
    - name: Summarize candidate for approval
      env:
        IMAGE: ${{ needs.candidate.outputs.image }}
        DIGEST: ${{ needs.candidate.outputs.digest }}
      run: |
        # Markdown backticks are literal formatting, not shell substitutions.
        # shellcheck disable=SC2016
        printf '### Tested candidate\n\nCommit: `%s`\n\nImage: `%s@%s`\n\nQuality, security, image scan and isolated runtime tests passed.\n' \
          "$GITHUB_SHA" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Approve and promote tested digest
    needs: [candidate, staging]
    if: github.ref == 'refs/heads/main' && needs.candidate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Refuse unprotected or stale production publication
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: node .github/scripts/image-policy.cjs
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Promote without rebuilding and verify every alias
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        IMAGE: ${{ needs.candidate.outputs.image }}
        DIGEST: ${{ needs.candidate.outputs.digest }}
      run: node scripts/ci/promote.cjs
    - name: Preserve publication record
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: image-digest-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: publication.json
        if-no-files-found: error
        retention-days: 90
