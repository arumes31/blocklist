name: "CodeQL"

on:
  push:
    # Dependabot has a read-only token on push; its PR still gets both analyses.
    branches-ignore: ['dependabot/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * 1' # Weekly scan at 01:30 on Monday

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [ 'go', 'javascript-typescript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    # Setup Go to ensure the environment is ready for compilation-based analysis
    - name: Set up Go
      if: matrix.language == 'go'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: go.mod

    # Initialize CodeQL. If this fails with ECONNRESET locally, consider using --toolcache in act.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
      with:
        languages: ${{ matrix.language }}

    # Go analysis usually works best with 'autobuild' for standard layouts.
    - name: Autobuild
      if: matrix.language == 'go'
      uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
      with:
        category: "/language:${{matrix.language}}"
