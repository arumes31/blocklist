name: Delete Old Packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only; do not delete packages
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  delete-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Delete old package versions
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: 'container'
          token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: ${{ inputs.dry_run }}
          keep-n-tagged: 10
          # Candidates can be awaiting approval. Explicitly retire them only
          # after checking the workflow run, never through generic cleanup.
          exclude-tags: ^(v1|v2|main|latest|test|v2b_test|rollback|candidate-.*)$
