name: Delete Old Packages
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview deletions without changing GHCR
        type: boolean
        default: true
        required: true
permissions: {}
concurrency:
  group: container-publication
  cancel-in-progress: false
jobs:
  delete-versions:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Retain candidates, aliases, rollback, releases and untagged manifests
        run: node scripts/ci/cleanup-packages.cjs
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
